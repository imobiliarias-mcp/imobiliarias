# Stack local completa: núcleo + portal web + PostgreSQL.
# Uso (a partir da raiz do repositório), com os segredos em portal_web/.env:
#   docker compose --env-file portal_web/.env -f central_mcp/compose.dev.yaml up -d --build
# Portal em http://localhost:3100, núcleo em http://localhost:8000.
services:
  central-mcp:
    build:
      context: ..
      dockerfile: central_mcp/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TZ=America/Sao_Paulo
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - CENTRAL_MCP_HOST=0.0.0.0
      - CENTRAL_MCP_PORT=8000
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (portal_web/.env)}
      POSTGRES_DB: portal
    volumes:
      - portal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  portal-web:
    build:
      context: ../portal_web
    ports:
      - "3100:3100"
    environment:
      TZ: America/Sao_Paulo
      GENERIC_TIMEZONE: America/Sao_Paulo
      CENTRAL_MCP_API_URL: http://central-mcp:8000
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (portal_web/.env)}@postgres:5432/portal
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3100}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina BETTER_AUTH_SECRET (portal_web/.env)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-}
      BRAND_ACCENT_COLOR: ${BRAND_ACCENT_COLOR:-}
    depends_on:
      postgres:
        condition: service_healthy
      central-mcp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  portal-db:
