[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "central-mcp"
version = "0.1.0"
description = "Central Rental Research Model Context Protocol (MCP) server in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[project.scripts]
central-mcp = "central_mcp.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/central_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
