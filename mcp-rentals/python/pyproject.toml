[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rental-bridge"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["jsonschema>=4.23", "httpx>=0.28", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["rental_bridge"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
