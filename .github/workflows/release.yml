name: release

# Publica a imagem do central MCP quando uma tag de versão (v* ou numérica, ex.: 1.0) é enviada e atualiza o Dokploy.
on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/imobiliarias-mcp/imobiliarias-central-mcp

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with agency submodules
        uses: actions/checkout@v4
        with:
          # Os submódulos são públicos: o GITHUB_TOKEN padrão basta para cloná-los.
          submodules: recursive

      - name: Build image
        uses: docker/setup-buildx-action@v3

      - name: Build and load image for audit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: central_mcp/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          load: true

      - name: Audit image for secrets and private files
        run: |
          # Ignora bibliotecas de terceiros instaladas (site-packages, /usr): contêm arquivos com
          # nomes como client_credentials.py e o bundle público cacert.pem, que não são segredos.
          found=$(docker run --rm --entrypoint /usr/bin/python3 "$IMAGE:$GITHUB_REF_NAME" -c \
            "import os; [print(os.path.join(r,f)) for r,_,fs in os.walk('/') if not any(part in r for part in ('/site-packages', '/usr/', '/proc', '/sys')) for f in fs if f.startswith('.env') or f.endswith(('.pem','.key')) or 'credentials' in f or f=='acme.json']")
          if [ -n "$found" ]; then echo "$found"; echo "Arquivos sensíveis na imagem; publicação cancelada."; exit 1; fi
        env:
          IMAGE: ${{ env.IMAGE }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: central_mcp/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          push: true

      - name: Point Dokploy service at the new tag and deploy
        env:
          DOKPLOY_BASE_URL: ${{ vars.DOKPLOY_BASE_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          NEW_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/dokploy_deploy.py

      - name: Check public health
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 15 https://imobiliarias.konexaplatform.xyz/healthz; then echo; exit 0; fi
            sleep 15
          done
          echo "healthz não respondeu após o deploy"; exit 1
